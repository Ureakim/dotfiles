---
- name: Install package
  package:
    name: neovim,luarocks
    state: present
  become: true

- name: Clone neovim config
  git:
    repo: https://github.com/Ureakim/dotvim.git
    dest: "{{ ansible_facts.env.HOME }}/.config/nvim"
    single_branch: yes
    version: nvim

- name: Create .bashrc.d directory
  ansible.builtin.file:
    path: ~/.bashrc.d
    state: directory

- name: Create symlinks
  file:
    src: "{{ role_path }}/files/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ app_file_symlinks }}"
